<title>Bedrock Showcase Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: the real app chrome (navy top bar, indigo sidebar, grey page) around ONE Mendix page: a setup checklist plus four Atlas tabs. Colours come from theme/web/custom-variables.scss. */
:root{
  --page:#f8f8f8; --surface:#ffffff; --surface-2:#f4f5f8; --line:#e0e2e8; --line-strong:#ced0d3;
  --fg:#0a1324; --muted:#5f6675; --brand:#264ae5; --brand-hover:#1b37b5; --brand-soft:#e9edff; --on-brand:#ffffff;
  --ok:#2e8f31; --ok-soft:#e6f5e6; --warn:#a56a00; --warn-soft:#fdf1d8; --crit:#c92f3e; --crit-soft:#fce8ea;
  --nav:#020557; --side:#24276c; --side-fg:#c9ccf0; --code:#f1f3f8;
  --t-ok:#2e8f31; --t-css:#b45309; --t-flow:#7c3aed;
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0f1220; --surface:#181c2e; --surface-2:#1e2336; --line:#2b3150; --line-strong:#3b4266;
  --fg:#e7e9f5; --muted:#9aa2c0; --brand:#8ea3ff; --brand-hover:#b0beff; --brand-soft:#252c57; --on-brand:#0b1030;
  --ok:#59c95c; --ok-soft:#17301a; --warn:#eab04a; --warn-soft:#352a10; --crit:#f2808b; --crit-soft:#3a1c22;
  --code:#11152a; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0f1220; --surface:#181c2e; --surface-2:#1e2336; --line:#2b3150; --line-strong:#3b4266;
  --fg:#e7e9f5; --muted:#9aa2c0; --brand:#8ea3ff; --brand-hover:#b0beff; --brand-soft:#252c57; --on-brand:#0b1030;
  --ok:#59c95c; --ok-soft:#17301a; --warn:#eab04a; --warn-soft:#352a10; --crit:#f2808b; --crit-soft:#3a1c22;
  --code:#11152a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)} .small{font-size:12px}
[data-mx]{position:relative}

/* app chrome (what Atlas_Default already provides) */
.shell{display:grid;grid-template-columns:216px minmax(0,1fr);grid-template-rows:48px 1fr;min-height:100vh}
.top{grid-column:1/-1;background:var(--nav);color:#fff;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top b{font-size:15px;margin-right:auto;letter-spacing:.01em}
.top .tool{display:flex;gap:8px;align-items:center}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:4px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.2)}
.tbtn[aria-pressed="true"]{background:#fff;color:var(--nav)}
.sidebar{background:var(--side);padding:10px 0 10px max(0px,env(safe-area-inset-left,0px))}
.sidebar a{display:block;padding:9px 18px;color:var(--side-fg);text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:default}
.sidebar a.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600;border-left-color:#7f95ff}
.sidebar a.dim{opacity:.55}
.sidebar small{display:block;padding:14px 18px 4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8d92d1}
.canvas{padding:24px max(24px,env(safe-area-inset-right,0px)) 56px 28px;min-width:0}
.page{max-width:1080px}
.ph{margin-bottom:16px}
.ph h1{font-size:24px;line-height:1.25}
.ph p{color:var(--muted);margin-top:4px}

/* Atlas tab container, Style: Lined */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:20px 0;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}

/* cards (needs small SCSS: stock Atlas has no card class) */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(10,19,36,.05)}
.card+.card,.stack>*+*{margin-top:16px}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.hd h3{font-size:15px}
.card>.hd p{font-size:12px;color:var(--muted);margin-top:2px}
.card>.bd{padding:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:16px}

/* Atlas form + buttons */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:7px 10px;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input[readonly],textarea[readonly]{background:var(--surface-2);color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--brand)}
.rl{display:flex;align-items:center;gap:10px}.rl output{font-family:var(--mono);font-size:12px;min-width:36px;text-align:right}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.success{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit);background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.link{border-color:transparent;background:transparent;color:var(--brand);padding:4px 8px}
.btn.link:hover{background:var(--brand-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.label{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:3px;white-space:nowrap}
.label.primary{background:var(--brand);color:var(--on-brand)}
.label.success{background:var(--ok);color:#fff}.label.warning{background:#eca51c;color:#2b1c00}.label.danger{background:var(--crit);color:#fff}
.label.default{background:var(--line);color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--crit-soft);color:var(--crit)}

/* Data Grid 2 */
.dg{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
.dgfoot{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.empty{padding:32px;text-align:center;color:var(--muted)}
.name{font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.ellip{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:90px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.pbar.ok i{background:var(--ok)}

/* Accordion */
.acc{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;background:transparent;border:0;padding:12px 16px;cursor:pointer;font-weight:600;text-align:left}
.acc>button .sum{font-weight:400;color:var(--muted);font-size:12px}
.acc>button svg{flex:none;transition:transform .15s}
.acc.open>button svg{transform:rotate(180deg)}
.acc>.in{padding:4px 16px 16px;border-top:1px solid var(--line)}
.acc.flat{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.acc.flat>button{padding-inline:0}
.acc.flat>.in{padding-inline:0;border-top:0}

/* notices (Atlas: container + background colour) */
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:4px;font-size:13px;background:var(--brand-soft);color:var(--fg)}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--crit-soft)} .note.good{background:var(--ok-soft)}
.note b{font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:12px;align-items:center}
.stepno{width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.resp{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:12px 16px;overflow-wrap:anywhere}
.resp p+p,.resp ul{margin-top:8px}.resp ul{padding-left:20px;margin-bottom:0}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.meta b{color:var(--fg)}
pre.code{margin:0;background:var(--code);border:1px solid var(--line);border-radius:4px;padding:10px 12px;overflow:auto;max-height:240px;font-family:var(--mono);font-size:12px;line-height:1.5}
.vals{font-family:var(--mono);font-size:12px;background:var(--code);border:1px solid var(--line);border-radius:4px;padding:10px 12px;overflow-wrap:anywhere}
.kvl{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:8px 16px;font-size:13px}
.kvl dt{color:var(--muted);font-weight:600;font-size:12px;padding-top:2px}.kvl dd{margin:0;overflow-wrap:anywhere}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

/* setup checklist */
.ready{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px 18px;padding:16px 18px}
.ri{display:flex;gap:10px;align-items:flex-start;min-width:0}
.ri .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-top:1px}
.ri .ic.ok{background:var(--ok-soft);color:var(--ok)} .ri .ic.no{background:var(--warn-soft);color:var(--warn)}
.ri b{display:block;font-size:13px;font-weight:600}.ri span.d{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* popup pages, blocking progress, toast, message dialog */
.overlay{position:fixed;inset:0;background:rgba(5,8,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(28px,env(safe-area-inset-top,0px)) 16px 28px;overflow:auto;z-index:50}
.overlay.blocking{align-items:center;background:rgba(255,255,255,.55);z-index:80}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .overlay.blocking{background:rgba(10,12,28,.6)}}
:root[data-theme="dark"] .overlay.blocking{background:rgba(10,12,28,.6)}
.popup{background:var(--surface);border-radius:6px;width:min(680px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.popup.wide{width:min(780px,100%)}
.popup.small{width:min(460px,100%)}
.popup>.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.popup>.hd h3{font-size:16px}
.popup>.bd{padding:20px;display:flex;flex-direction:column;gap:16px}
.popup>.ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 6px 6px}
.blockbox{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 22px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.2);font-weight:600}
.spin{width:16px;height:16px;border:2px solid var(--brand);border-right-color:transparent;border-radius:50%;display:inline-block;animation:r .7s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}.acc>button svg{transition:none}}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));top:64px;background:var(--ok);color:#fff;padding:10px 18px;border-radius:4px;font-weight:600;font-size:13px;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 40px)}
.toast.bad{background:var(--crit)}

/* Ask tickets tab (new): composer, thread of answers, source cards */
.ask-wrap{max-width:860px}
.ask-bar{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.composer textarea{min-height:92px;font-size:15px;border-radius:6px;padding:12px 14px}
.composer .tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.sug{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer;color:var(--fg)}
.sug:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.sugs{display:flex;gap:8px;flex-wrap:wrap}
.entry{margin-top:16px}
.entry .qhd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
.entry .qhd .q{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.entry .qhd .tm{font-size:12px;color:var(--muted);white-space:nowrap}
.entry .ans{padding:16px 18px;font-size:14.5px;line-height:1.65;overflow-wrap:anywhere}
.entry .ans p+p,.entry .ans ul{margin-top:10px}.entry .ans ul{padding-left:20px;margin-bottom:0}
.entry .srch{padding:0 18px 16px}
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px;margin-top:8px}
.src{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.src .shd{display:flex;gap:8px;align-items:flex-start}
.src .n{width:20px;height:20px;border-radius:4px;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:11px;display:grid;place-items:center;flex:none;margin-top:1px}
.src .t{font-weight:600;font-size:13px;line-height:1.35}
.src .d{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry .ft{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.entry .ft .sp{margin-left:auto}
.emptyask{text-align:center;padding:36px 18px;color:var(--muted)}
.emptyask h3{color:var(--fg);margin-bottom:6px;font-size:16px}
.strict{font-size:12px;font-weight:600;color:var(--muted);min-width:64px;text-align:right}
.guide-run{margin-top:6px}
.drawer ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.drawer ol li{display:block;border:1px solid var(--line);border-radius:6px;padding:12px}
.drawer ol li b{display:block;font-size:13px;margin-bottom:2px}
.drawer ol li span{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}

/* mapping overlay + notes drawer */
body.mx [data-mx]{outline:1.5px dashed var(--t-ok);outline-offset:2px}
body.mx [data-mx][data-c="css"]{outline-color:var(--t-css)}
body.mx [data-mx][data-c="flow"]{outline-color:var(--t-flow)}
body.mx [data-mx]::after{content:attr(data-mx);position:absolute;top:-10px;left:6px;background:var(--t-ok);color:#fff;font:600 10px/1.55 var(--mono);padding:0 6px;border-radius:3px;z-index:30;white-space:nowrap;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;pointer-events:none}
body.mx [data-mx][data-c="css"]::after{background:var(--t-css)}
body.mx [data-mx][data-c="flow"]::after{background:var(--t-flow)}
.legend{display:none;gap:12px;font-size:11px;font-weight:600;align-items:center;margin-left:4px;color:#fff}
body.mx .legend{display:flex}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.drawer{position:fixed;top:48px;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.18);z-index:40;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 20px}
.drawer h3{font-size:15px;margin:22px 0 8px}.drawer h3:first-of-type{margin-top:14px}
.drawer ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.drawer li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.drawer li .k{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.k.y{background:var(--t-ok)}.k.c{background:var(--t-css)}.k.f{background:var(--t-flow)}.k.n{background:var(--crit)}
.drawer code{font-family:var(--mono);font-size:11.5px;background:var(--code);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .canvas{padding:18px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
  .legend{display:none!important}
  .kvl{grid-template-columns:minmax(0,1fr)}
}
</style>

<div class="shell">
  <header class="top">
    <b>GenAI Showcase</b>
    <span class="legend"><span><i style="background:var(--t-ok)"></i>Stock widget</span><span><i style="background:var(--t-css)"></i>Small SCSS</span><span><i style="background:var(--t-flow)"></i>Microflow work</span></span>
    <div class="tool">
      <button class="tbtn" id="bMx" aria-pressed="false" data-act="mx">Mendix mapping</button>
      <button class="tbtn" id="bGuide" aria-pressed="false" data-act="guide">Test guide</button>
      <button class="tbtn" id="bNotes" aria-pressed="false" data-act="notes">Build notes</button>
    </div>
  </header>
  <nav class="sidebar" aria-label="App menu">
    <small>Showcase</small>
    <a class="dim">Home</a><a class="dim">Configuration</a><a class="dim">Chat completions</a><a class="dim">Embeddings</a>
    <a class="on" aria-current="page">AWS Bedrock Implementation</a>
    <a class="dim">PgVector DB Config</a><a class="dim">Administration</a>
  </nav>
  <main class="canvas"><div class="page" id="page"></div></main>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Build notes"></aside>
<aside class="drawer" id="guide" hidden aria-label="Test guide"></aside>
<div id="layer"></div>

<script>
/* =====================================================================
   MOCK BACKEND. Each function is named after the microflow that replaces it.
   Everything below this block is UI that maps 1:1 to Mendix widgets.
   ===================================================================== */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const FAMILY = {
  claude: { label:'Anthropic Claude', short:'Claude', kind:'chat',      style:'primary' },
  cohere: { label:'Cohere Embed',     short:'Cohere', kind:'embedding', style:'success' },
  titan:  { label:'Amazon Titan Embeddings V2', short:'Titan', kind:'embedding', style:'warning' },
};
const ENV = { auth:'Web identity (IRSA)', role:'arn:aws:iam::123456789012:role/genai-showcase-bedrock', token:'/var/run/secrets/eks.amazonaws.com/serviceaccount/token', encKey:true };
const DB = {
  config: { chat:'m1', emb:'m2', pg:'p1', region:'eu-central-1', gid:'', gver:0, awsOk:true, awsAt:Date.now()-5*3600e3, chunksModel:'m2', chunksAt:Date.now()-2*3600e3 },

/* embedding stand-in: hashed bag of words, same idea as bedrock-local-emulator/aws-mock */
const STOP = new Set('the a an i my me we our you your to of in on at for with and or but is are was were be been it its this that when every time each have has had do does did not no can from as by if then so how what why will would should could may also into out up about over after before again there their them they just'.split(' '));
const stem = w => w.length>4 ? w.replace(/(ing|ed|es|s)$/,'').replace(/e$/,'') : w;
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619) } return h>>>0 }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296 } }
const wc = {};
function embed(text, dim, salt){
  const v = new Float64Array(dim);
  text.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w&&!STOP.has(w)).map(stem).forEach(w=>{
    const k=salt+'|'+w+'|'+dim; if(!wc[k]){ const r=rng(hash(salt+w)); wc[k]=Array.from({length:dim},()=>r()*2-1) }
    wc[k].forEach((x,i)=>v[i]+=x);
  });
  const n = Math.sqrt(v.reduce((s,x)=>s+x*x,0))||1; return Array.from(v,x=>x/n);
}
const cos = (a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
const estTok = s => Math.max(1,Math.round(s.trim().split(/\s+/).filter(Boolean).length*1.35));

function answerFor(prompt, ctx){
  const p = prompt.trim().replace(/\s+/g,' '), t = p.length>70?p.slice(0,67)+'…':p;
  if (ctx && ctx.length){
    return `Here is what the ticket data says about “${t}”.\n\n`+ctx.slice(0,3).map(c=>`- **${c.subject}** (ticket ${c.id}): ${c.desc.split('. ')[0].replace(/\.$/,'')}.`).join('\n')+
      `\n\nThe closest match is **${ctx[0].subject}**. Start by checking whether the problem is reproducible with a fresh document, then compare against the resolution on that ticket. If the tickets disagree, ask the customer for the reproduction steps.`;
  }
  return `Happy to help with “${t}”.\n\nStart by pinning down the goal and the constraints, then compare the realistic options on cost, effort and risk. A practical next step is to try the smallest version that could work and measure it.`;
}

/* ACT_Model_Try -> unified wrapper over ACT_AnthropicRequest_Send / ACT_CohereRequest_Send / ACT_TitalEmbeddingsV2Request_Send */
async function actModelTry(m, input, o){
  if (FAMILY[m.family].kind==='chat'){
    const rawReq = { anthropic_version:'bedrock-2023-05-31', max_tokens:o.maxTokens, ...(o.system?{system:o.system}:{}), thinking:{type:'adaptive'}, output_config:{effort:o.effort}, messages:[{role:'user',content:input}] };
    const text = answerFor(input,null), inTok=estTok((o.system||'')+' '+input), outTok=estTok(text), lat=900+outTok*8+Math.round(Math.random()*200);
    await sleep(Math.min(1800,lat*.6));
    return { kind:'chat', text, inTok, outTok, lat, rawReq, rawRes:{id:'msg_01XFD',type:'message',role:'assistant',model:m.modelId,content:[{type:'text',text}],stop_reason:'end_turn',usage:{input_tokens:inTok,output_tokens:outTok}} };
  }
  const dim = o.dim, vec = embed(input,dim,m.id);
  const rawReq = m.family==='cohere' ? {texts:[input],input_type:o.inputType,embedding_types:['float'],output_dimension:dim,max_tokens:128000,truncate:o.truncate}
                                     : {inputText:input,dimensions:dim,normalize:o.normalize,embeddingTypes:['float']};
  const lat = 260+Math.round(Math.random()*180); await sleep(lat*.8);
  return { kind:'embedding', vec, dim, lat, rawReq, rawRes: m.family==='cohere' ? {id:'a53c8268',embeddings:{float:[[...vec.slice(0,3).map(n=>+n.toFixed(5)),'… '+(dim-3)+' more']]},response_type:'embeddings_by_type'} : {embedding:[...vec.slice(0,3).map(n=>+n.toFixed(5)),'… '+(dim-3)+' more'],inputTextTokenCount:estTok(input)} };
}

/* ACT_Pagehelper_Send_SearchItem */
async function actSearch(q,max,min){
  const m = mdl(DB.config.emb); await sleep(700);
  if (DB.chunks.length && DB.chunks[0].dim !== m.dim) return { error:`The knowledge base holds ${DB.chunks[0].dim}-dimension vectors but ${m.name} produces ${m.dim}. Create the chunks again.` };
  const qv = embed(q,m.dim,m.id);
  const res = DB.chunks.map(c=>({ ...c, sim: Math.max(0,Math.min(0.99,cos(qv,c.vec)*1.7)) })).filter(c=>c.sim>=min).sort((a,b)=>b.sim-a.sim).slice(0,max);
  return { results:res };
}

const EXAMPLES = ['Why can’t users save their documents?','How should we reply to customers who cannot submit the form?','Which printing problems are already solved?','Are there any problems with shared or cloud documents?'];
const strictLabel = v => v<0.2?'Loose':v<0.45?'Balanced':'Strict';
/* ACT_Ask (NEW microflow): chains the existing search flow and the existing prompt flow, then creates an AskEntry */
function answerCited(ctx){
  const t=ctx[0], first=s=>s.split('. ')[0].replace(/\.$/,'');
  return `**What the tickets say.** ${ctx.slice(0,3).map((c,i)=>`${c.subject} [${i+1}]`).join(', ')} describe closely related problems. The most similar one, ticket ${t.id} [1], reports: “${first(t.desc)}.”\n\n**Suggested reply**\n- Thank the customer and confirm you are looking into it.\n- Ask for the reproduction steps, as in ticket ${t.id} [1].\n- Offer the workaround from the matching ticket if it has one.\n\n**Next step** Link the related tickets so that one fix can close them all.`;
}
async function runAsk(q){
  const a=S.ask2, c=DB.config, t0=performance.now();
  block('Searching the tickets and asking '+mdl(c.chat).name+'…');
  const r=await actSearch(q,a.max,a.min);
  const base={ id:'e'+Date.now(), q, at:Date.now(), min:a.min, max:a.max, model:mdl(c.chat).name };
  let entry;
  if(r.error) entry={...base,error:r.error};
  else if(!r.results.length) entry={...base,none:true};
  else { await sleep(900+Math.random()*500); const ctx=r.results; entry={...base,answer:answerCited(ctx.map(x=>x.t)),sources:ctx,ctx:ctx.map(x=>x.t)}; }
  entry.secs=(performance.now()-t0)/1000;
  unblock(); a.entries.unshift(entry); a.q=''; render();
  document.getElementById('a2q')?.focus({preventScroll:true});
}

  if(e.error) return `<article class="card entry">${head}<div class="ans"><div class="note bad"><span>${esc(e.error)}</span></div></div></article>`;

  return `<article class="card entry" ${mx('List view · AskEntry (non-persistent) · sorted by CreatedDate desc','flow')}>${head}
    <div class="ans" ${mx('Markdown widget · AskEntry/Answer','ok')}>${md(e.answer)}</div>

      <div class="srcs" ${mx('List view · AskEntry_TicketChunk · cards = container + Progress bar widget','css')}>${e.sources.map((s,i)=>`<div class="src"><div class="shd"><span class="n">${i+1}</span><div><div class="t">${esc(s.t.subject)}</div><div class="sub">Ticket ${s.t.id} · ${esc(s.t.status)}</div></div></div><div class="d">${esc(s.t.desc)}</div><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="pbar" style="flex:1"><i style="width:${s.sim*100}%"></i></div><span class="mono">${s.sim.toFixed(2)}</span></div></div>`).join('')}</div></div>
    <div class="acc flat" style="padding:0 18px"><button data-act="a2ctx" data-id="${e.id}" aria-expanded="${!!S.open['ctx'+e.id]}"><span>Exactly what was sent to the model</span>${chev}</button>${S.open['ctx'+e.id]?`<div class="in"><textarea readonly style="min-height:140px;font-family:var(--mono);font-size:12px">${esc(e.ctx.map((c,i)=>'['+(i+1)+'] '+ticketText(c)).join('\n\n'))}</textarea></div>`:''}</div>
    <div class="ft"><span>${e.sources.length} tickets · ${e.secs.toFixed(1)} s · ${esc(e.model)}</span><span class="sp"><button class="btn sm link" data-act="a2again" data-id="${e.id}">Ask again</button></span></div></article>`;
}

const A = {
  mx(){ S.mx=!S.mx; document.body.classList.toggle('mx',S.mx); $('#bMx').setAttribute('aria-pressed',S.mx) },
  notes(){ S.notes=!S.notes; if(S.notes) S.guide=false; $('#bNotes').setAttribute('aria-pressed',S.notes); $('#bGuide').setAttribute('aria-pressed',S.guide); renderDrawer() },
  guide(){ S.guide=!S.guide; if(S.guide) S.notes=false; $('#bGuide').setAttribute('aria-pressed',S.guide); $('#bNotes').setAttribute('aria-pressed',S.notes); renderDrawer() },
  guiderun:t=>GUIDE[+t.dataset.i][2](),

  async a2send(){ readInputs(); const q=S.ask2.q.trim(); if(!q){ toast('Write a question first',true); return } await runAsk(q) },
  async a2again(t){ readInputs(); const e=S.ask2.entries.find(x=>x.id===t.dataset.id); await runAsk(e.q) },
  async a2lower(t){ readInputs(); const e=S.ask2.entries.find(x=>x.id===t.dataset.id); S.ask2.min=Math.max(0,+(e.min-0.15).toFixed(2)); await runAsk(e.q) },
  a2ctx:t=>{ S.open['ctx'+t.dataset.id]=!S.open['ctx'+t.dataset.id]; readInputs(); render() },
  a2clear(){ S.ask2.entries=[]; render() },
  tab:t=>setTab(t.dataset.v),
  acc:t=>{ S.open[t.dataset.k]=!S.open[t.dataset.k]; readInputs(); if(S.popup==='try') drawTry(); else render() },
  closepop:(t,e)=>{ if(!t.classList.contains('overlay')||e.target===t){ closeAll(); render() } },
  /* models */
  trymodel:t=>{ S.tr.modelId=t.dataset.id; S.tr.result=null; S.tr._for=null; S.popup='try'; drawTry() },

  editmodel:t=>{ S.ed={...mdl(t.dataset.id),orig:t.dataset.id}; S.popup='edit'; drawEdit() },
  delmodel:t=>{ const id=t.dataset.id, m=mdl(id);
    if(id===DB.config.chat||id===DB.config.emb){ msgBox('Cannot delete','<p>'+esc(m.name)+' is in use as the '+(id===DB.config.chat?'chat':'embedding')+' model. Pick another model first.</p>',true); return }

    if(DB.models.some(m=>m.modelId===e.modelId.trim()&&m.id!==e.orig)){ toast('A model with this ID already exists',true); return }
    const rec={ id:e.orig||'m'+Date.now(), name:e.name.trim(), modelId:e.modelId.trim(), family:e.family };
    if(e.family==='claude'){ rec.maxTokens=e.maxTokens; rec.effort=e.effort } else { rec.dim=e.dim; if(e.family==='cohere'){ rec.inputType=e.inputType; rec.truncate=e.truncate } else rec.normalize=e.normalize }
    const i=DB.models.findIndex(m=>m.id===e.orig); if(i>=0) DB.models[i]=rec; else DB.models.push(rec);

  },
  async listaws(){ block('Calling Bedrock…'); const L=await actListModels(); unblock(); msgBox('Action executed successfully!','<p class="muted small" style="margin-bottom:8px">Response:</p><div class="vals">'+L.map(r=>'Model ID: '+esc(r[0])+'<br>Provider: '+esc(r[1])+'<br>Name: '+esc(r[2])).join('<br><br>')+'</div>') },

  async testaws(){ readInputs(); block('Testing the connection to AWS…'); const r=await actTestAws(S.conn.region); unblock(); S.awsResult=r; DB.config.awsOk=r.ok; DB.config.awsAt=Date.now(); if(r.ok) DB.config.region=S.conn.region; render() },
  /* pgvector */
  addpg:()=>{ S.pgEd={orig:null,name:'',jdbc:'',user:'',hasPw:false}; S.popup='pg'; drawPg() },
  editpg:t=>{ S.pgEd={...pgOf(t.dataset.id),orig:t.dataset.id}; S.popup='pg'; drawPg() },

    const g=id=>document.getElementById(id).value, e=S.pgEd, name=g('pName').trim(), jdbc=g('pJdbc').trim(), user=g('pUser').trim(), pw=g('pPw');
    if(!name||!jdbc||!user){ toast('Name, JDBC URL and username are required',true); return }
    if(!e.orig&&!pw){ toast('Enter a password',true); return }
    const rec={ id:e.orig||'p'+Date.now(), name, jdbc, user, hasPw:e.hasPw||!!pw, tested:false };
    const i=DB.pgs.findIndex(p=>p.id===e.orig); if(i>=0) DB.pgs[i]=rec; else DB.pgs.push(rec);
    if(!DB.config.pg) DB.config.pg=rec.id;
    closeAll(); render(); toast('Saved. Click Test to check the connection.');
  },
  /* tickets */
  populate:()=>confirmBox('Load sample tickets','<p>This replaces all current tickets with the 12 sample tickets.</p>','dopopulate','','Replace tickets'),
  dopopulate:()=>{ populateTickets(); closeAll(); render(); toast('Sample tickets loaded') },
  addticket:()=>{ S.tk={orig:null,subject:'',desc:'',steps:'',res:'',category:'Bug',status:'Open'}; S.popup='ticket'; drawTicket() },
  editticket:t=>{ const k=DB.tickets.find(x=>x.id==t.dataset.id); S.tk={...k,orig:k.id}; S.popup='ticket'; drawTicket() },
  delticket:t=>{ const k=DB.tickets.find(x=>x.id==t.dataset.id); confirmBox('Delete ticket','<p>Delete ticket <b>'+k.id+'</b>, “'+esc(k.subject)+'”?</p>','dodelticket',k.id,'Delete') },
  dodelticket:t=>{ DB.tickets=DB.tickets.filter(x=>x.id!=t.dataset.id); closeAll(); render(); toast('Ticket deleted') },
  saveticket(){
    const g=id=>document.getElementById(id).value, e=S.tk; if(!g('kSub').trim()||!g('kDesc').trim()){ toast('Subject and description are required',true); return }
    const rec={ id:e.orig||nextTicket++, subject:g('kSub').trim(), desc:g('kDesc').trim(), steps:g('kSteps').trim(), res:g('kRes').trim(), category:g('kCat'), status:g('kSt'), changed:Date.now() };
    const i=DB.tickets.findIndex(x=>x.id===e.orig); if(i>=0) DB.tickets[i]=rec; else DB.tickets.push(rec);
    closeAll(); render(); toast('Ticket saved');
  },
  async chunks(){ block('Creating chunks and embedding '+DB.tickets.length+' tickets…'); await actCreateChunks(); unblock(); S.search.results=null; S.search.ctx=[]; render(); toast('Chunks stored in the knowledge base') },
  async search(){ readInputs(); const s=S.search; block('Searching knowledge base…'); const r=await actSearch(s.q,s.max,s.min); unblock(); if(r.error){ s.err=r.error; s.results=null } else { s.err=null; s.results=r.results; s.ctx=r.results.map(x=>x.t) } render() },
  async ask(){ readInputs(); block('Sending request to '+mdl(DB.config.chat).name+'…'); const r=await actAsk(S.ask.system,S.ask.prompt,'',S.search.ctx); unblock(); S.ask.resp=r.text; render() },
  async trysend(){ readInputs(); const t=S.tr, m=mdl(t.modelId); if(!t.input.trim()){ toast('Enter some text first',true); return }
    block('Sending request…'); t.result=await actModelTry(m,t.input,{system:t.system,maxTokens:t.maxTokens,effort:t.effort,dim:t.dim,inputType:t.inputType,truncate:t.truncate,normalize:t.normalize}); unblock(); drawTry() },
};
function readInputs(){
  const g=id=>document.getElementById(id), v=id=>g(id)?g(id).value:undefined;
  if(S.popup==='try'){ const t=S.tr; if(g('tIn')) t.input=v('tIn'); if(g('tSys')) t.system=v('tSys'); if(g('tMax')) t.maxTokens=+v('tMax')||1; if(g('tEff')) t.effort=v('tEff'); if(g('tDim')) t.dim=+v('tDim'); if(g('tIt')) t.inputType=v('tIt'); if(g('tTr')) t.truncate=v('tTr'); if(g('tNo')) t.normalize=v('tNo')==='true' }
  if(!S.popup){
    if(g('sq')) S.search.q=v('sq'); if(g('smax')) S.search.max=Math.max(1,+v('smax')||5); if(g('smin')) S.search.min=+v('smin');
    if(g('asys')) S.ask.system=v('asys'); if(g('apr')) S.ask.prompt=v('apr');
    if(g('a2q')) S.ask2.q=v('a2q'); if(g('a2sys')) S.ask2.system=v('a2sys'); if(g('a2max')) S.ask2.max=+v('a2max'); if(g('a2min')) S.ask2.min=+v('a2min');
    if(g('cRegion')) S.conn.region=v('cRegion'); if(g('cGid')) S.conn.gid=v('cGid'); if(g('cGver')) S.conn.gver=+v('cGver')||0;
  }
}
function readEdit(){
  const e=S.ed, g=id=>document.getElementById(id), v=id=>g(id)?g(id).value:undefined;
  e.name=v('eName'); e.modelId=v('eId'); e.family=v('eFam');
  if(g('eMax')) e.maxTokens=+v('eMax')||5000; if(g('eEff')) e.effort=v('eEff'); if(g('eDim')) e.dim=+v('eDim'); if(g('eIt')) e.inputType=v('eIt'); if(g('eTr')) e.truncate=v('eTr'); if(g('eNo')) e.normalize=v('eNo')==='true';
}
/* buttons inside a clickable grid row act on their own, they must not also open the row's edit pop-up */
document.addEventListener('click',e=>{ const t=e.target.closest('[data-act]'); if(!t) return; const f=A[t.dataset.act]; if(f) f(t,e) });
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='smin'){ $('#sminO').textContent=(+e.target.value).toFixed(2); S.search.min=+e.target.value }
  else if(id==='a2max'){ S.ask2.max=+e.target.value; $('#a2maxO').textContent=e.target.value }
  else if(id==='a2min'){ S.ask2.min=+e.target.value; $('#a2minO').textContent=(+e.target.value).toFixed(2); $('#a2minL').textContent=strictLabel(+e.target.value) }
  else if(id==='a2q'){ S.ask2.q=e.target.value }
  else if(id==='tq'){ S.tq=e.target.value; const p=e.target.selectionStart; render(); const f=$('#tq'); f.focus(); f.setSelectionRange(p,p) }
});
document.addEventListener('change',e=>{
  const id=e.target.id, v=e.target.value;
  if(e.target.dataset.sel){ DB.config[e.target.dataset.sel]=v; render(); toast('Saved') }
  else if(id==='eFam'){ readEdit(); S.ed.family=v; drawEdit() }
  else if(id==='tModel'){ readInputs(); S.tr.modelId=v; S.tr._for=null; S.open.adv=false; drawTry() }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.popup){ closeAll(); render() }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='a2q'){ e.preventDefault(); A.a2send() }
});
window.addEventListener('hashchange',()=>setTab(location.hash.slice(1)));

/* start in a working state: tickets loaded and chunks already stored with the current embedding model */
populateTickets();
DB.chunks = DB.tickets.map((t,i)=>({ id:'c'+(i+1), human:'Ticket '+t.id, text:ticketText(t), t:{...t}, dim:1024, vec:embed(ticketText(t),1024,'m2'), idx:i }));
(async()=>{ const r=await actSearch(S.search.q,S.search.max,S.search.min); S.search.results=r.results; S.search.ctx=r.results.map(x=>x.t); setTab(location.hash.slice(1)||'connections') })();
</script>
